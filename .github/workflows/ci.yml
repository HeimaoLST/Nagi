name: CI

on:
  pull_request:
  push:
    branches: [dev, integration, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  gui:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        id: gui-python
        with:
          python-version: '3.12'
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Governance guard
        run: python3 scripts/check-governance.py --strict .
      - name: Nagi vet, tests and independent build
        env:
          CGO_ENABLED: '0'
          NAGI_TEST_ONLINE: '0'
        run: |
          python3 scripts/gui-go.py vet ./...
          python3 scripts/gui-go.py test ./cmd/nagi ./internal/app ./internal/connection ./internal/locale ./internal/markdown ./internal/materials ./internal/pi ./internal/store ./internal/theme ./locales -count=1
          python3 scripts/gui-go.py test github.com/egoist/mygo/ui -run '^(TestSplitReleaseBeforeFrame|TestTextAreaDragReleaseBeforeFrame)$' -count=1 -v
          GOARCH=arm64 python3 scripts/gui-go.py build -trimpath -mod=readonly -buildvcs=true -o "$RUNNER_TEMP/Nagi" ./cmd/nagi
      - name: Headless previews
        id: headless-previews
        if: ${{ !cancelled() && steps.gui-python.outcome == 'success' }}
        run: python3 scripts/capture-ui-review.py "$RUNNER_TEMP/nagi-previews"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.headless-previews.outcome == 'success' || steps.headless-previews.outcome == 'failure') }}
        with:
          name: nagi-headless-previews
          path: ${{ runner.temp }}/nagi-previews/
          if-no-files-found: error
  pi-integration:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch exact pinned Node runtime
        id: node-runtime
        run: |
          python3 scripts/fetch-node-runtime.py --pin .github/pi-runtime.json --output "$RUNNER_TEMP/node-runtime"
          python3 - <<'PYTHON'
          import json
          import os
          with open(".github/pi-runtime.json") as handle:
              version = json.load(handle)["node"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"version={version}\n")
          PYTHON
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-runtime.outputs.version }}
          package-manager-cache: false
      - name: Build external pinned worker payload
        run: python3 scripts/build-pi-worker.py --runtime "$RUNNER_TEMP/node-runtime" --output "$RUNNER_TEMP/pi-payload"
      - name: Worker and domain unit tests
        env:
          CGO_ENABLED: '0'
          NAGI_TEST_ONLINE: '0'
          NAGI_TEST_NODE: ${{ runner.temp }}/pi-payload/bin/node
          NAGI_TEST_WORKER: ${{ runner.temp }}/pi-payload/dist/worker.js
          NAGI_WORKER_DIST: ${{ runner.temp }}/pi-payload/dist
        run: |
          "$NAGI_TEST_NODE" --test internal/pi/worker/tests/*.test.mjs
          python3 scripts/gui-go.py test -v ./internal/pi -run TestWorkerDomainUnits -count=1
      - name: Assemble signed standalone app
        run: python3 scripts/build-macos-app.py --payload "$RUNNER_TEMP/pi-payload" --output "$RUNNER_TEMP/nagi-app"
      - name: Pi process and product integration
        timeout-minutes: 25
        env:
          CGO_ENABLED: '1'
          NAGI_TEST_ONLINE: '0'
          NAGI_TEST_NODE: ${{ runner.temp }}/pi-payload/bin/node
          NAGI_TEST_WORKER: ${{ runner.temp }}/pi-payload/dist/worker.js
          NAGI_TEST_APP_BUNDLE: ${{ runner.temp }}/nagi-app/Nagi.app
          NAGI_PREVIEW_DIR: ${{ runner.temp }}/nagi-pi-previews
          NAGI_ACTIVITY_EVIDENCE_DIR: ${{ runner.temp }}/nagi-pi-previews
        run: |
          mkdir -p "$NAGI_PREVIEW_DIR"
          set -o pipefail
          selector=$(python3 scripts/check-pi-results.py --selector)
          python3 scripts/gui-go.py test -tags=integration -race -timeout=20m -json -count=1 ./internal/pi ./internal/app \
            -run "$selector" \
            | tee "$RUNNER_TEMP/nagi-pi-results.jsonl"
      - name: Require actual Pi core and product scenarios
        if: always()
        run: python3 scripts/check-pi-results.py "$RUNNER_TEMP/nagi-pi-results.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nagi-pi-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/nagi-pi-results.jsonl
            ${{ runner.temp }}/node-runtime/manifest.json
            ${{ runner.temp }}/pi-payload/manifest.json
            ${{ runner.temp }}/pi-payload/build.log
            ${{ runner.temp }}/nagi-app/build.log
            ${{ runner.temp }}/nagi-app/manifest.json
            ${{ runner.temp }}/nagi-pi-previews/*.png
          if-no-files-found: error
  ci-required:
    if: always()
    needs: [gui, pi-integration]
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - name: Require GUI and actual Pi integration
        env:
          GUI_RESULT: ${{ needs.gui.result }}
          PI_RESULT: ${{ needs.pi-integration.result }}
        run: |
          echo "gui=$GUI_RESULT pi-integration=$PI_RESULT"
          test "$GUI_RESULT" = success
          test "$PI_RESULT" = success
